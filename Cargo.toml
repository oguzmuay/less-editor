[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/oguzmuay/less-editor"

[workspace.lints.rust]
unsafe_code = "forbid"

# Debug info is the bulk of target/debug; panics keep file:line, lldb loses locals.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

// Run paneli: -PrunnerJdwp=<jdwp seçenekleri> JDWP ajanı, -PrunnerJvmArgs="<VM seçenekleri>" ek JVM argümanları ekler
// (her projedeki bootRun görevine).
def jdwp = gradle.startParameter.projectProperties.get("runnerJdwp")
def jvm = gradle.startParameter.projectProperties.get("runnerJvmArgs")
if (jdwp || jvm) {
  gradle.allprojects { project ->
    project.tasks.matching { it.name == "bootRun" }.configureEach { task ->
      if (jvm) task.jvmArgs(jvm.trim().split(/\s+/) as List)
      if (jdwp) task.jvmArgs("-agentlib:jdwp=" + jdwp)
    }
  }
}

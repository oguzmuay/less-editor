name: Release

# Tag push v* -> build macOS (universal) + Linux (experimental) and publish a GitHub Release.
# workflow_dispatch -> same builds as downloadable workflow artifacts, no release.
# Optional secrets (all unset = ad-hoc signed, not notarized):
#   APPLE_CERTIFICATE_P12 (base64 .p12 of a Developer ID Application cert), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password) -> notarization.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build (no release is created)"
        default: "0.0.0-dev"

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.1

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=${INPUT_VERSION:-0.0.0-dev}; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

  macos:
    needs: version
    # GitHub-hosted image with Xcode 27 (what Ghostty 1.4 builds with upstream).
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      LESS_VERSION: ${{ needs.version.outputs.version }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Metal Toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          kc="$RUNNER_TEMP/less.keychain-db" pw=$(uuidgen)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build LESS.app (universal)
        run: make app XCFW=universal

      - name: Package (zip + dmg)
        env:
          LESS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          LESS_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          LESS_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LESS_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: app/scripts/package-macos.sh build/LESS.app build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: less-macos
          path: build/dist/*
          if-no-files-found: error

  linux:
    needs: version
    # Experimental: Ghostty's GTK build is only CI-tested upstream through Nix; a failure here doesn't block the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      LESS_VERSION: ${{ needs.version.outputs.version }}
      BLUEPRINT_VERSION: 0.20.4
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev gettext libxml2-utils \
            pkg-config librsvg2-bin rsync meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 blueprint-compiler

      # Ghostty 1.4 needs blueprint-compiler >= 0.20; Ubuntu 26.04 ships 0.19.
      - name: blueprint-compiler ${{ env.BLUEPRINT_VERSION }}
        run: |
          have=$(blueprint-compiler --version 2>/dev/null || echo 0)
          if [ "$(printf '%s\n' 0.20.0 "$have" | sort -V | head -1)" != 0.20.0 ]; then
            git clone --depth 1 -b "v$BLUEPRINT_VERSION" https://gitlab.gnome.org/GNOME/blueprint-compiler.git "$RUNNER_TEMP/bp"
            meson setup "$RUNNER_TEMP/bp/build" "$RUNNER_TEMP/bp" --prefix=/usr/local
            sudo meson install -C "$RUNNER_TEMP/bp/build"
            hash -r
          fi
          blueprint-compiler --version

      - name: Build Ghostty (GTK)
        working-directory: app/ghostty
        run: zig build -p "$RUNNER_TEMP/prefix" -Doptimize=ReleaseFast -Dcpu=baseline -Dversion-string="$LESS_VERSION"

      - name: Package (tar.gz)
        run: app/scripts/package-linux.sh "$RUNNER_TEMP/prefix" build/dist

      - name: Smoke test (version + LESS defaults validate)
        run: |
          mkdir "$RUNNER_TEMP/t" && tar -C "$RUNNER_TEMP/t" -xzf build/dist/*.tar.gz
          d=$(echo "$RUNNER_TEMP"/t/less-editor-*)
          "$d/lib/less-editor/ghostty" +version
          "$d/lib/less-editor/ghostty" +validate-config --config-file="$d/share/less/defaults.ghostty"

      - uses: actions/upload-artifact@v4
        with:
          name: less-linux-${{ matrix.os }}
          path: build/dist/*
          if-no-files-found: error

  release:
    needs: [version, macos, linux]
    if: always() && github.ref_type == 'tag' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: less-*
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd dist && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt
          linux="Linux (experimental): \`less-editor-$VERSION-linux-<arch>.tar.gz\`, extract and run \`./install.sh\`. Needs GTK 4.14+, libadwaita 1.7+, neovim, zsh."
          ls ./*linux* >/dev/null 2>&1 || linux="Linux: no build in this release (the experimental Linux job failed)."
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          **macOS 13+ (Apple silicon and Intel):** download \`LESS-$VERSION-macos-universal.dmg\` (or \`.zip\`), then run \`./install.sh\` from it, or drag LESS.app to Applications.
          Prerequisites: \`brew install neovim git ripgrep fd\`.

          If the build is not notarized, macOS reports LESS as "damaged" or from an unidentified developer. Clear the download flag once:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/LESS.app
          \`\`\`

          $linux

          Windows: not available (Ghostty, which LESS is built on, has no Windows build).

          Verify downloads with \`SHA256SUMS.txt\`. LESS is built on [Ghostty](https://github.com/ghostty-org/ghostty) (MIT).
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: LESS ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: dist/*

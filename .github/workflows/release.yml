name: Release

# Tag push v* -> build a universal macOS LESS.app (zip + dmg) and publish a GitHub Release.
# workflow_dispatch -> same build as a downloadable workflow artifact, no release.
# Builds are ad-hoc signed and not notarized.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build (no release is created)"
        default: "0.0.0-dev"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=${INPUT_VERSION:-0.0.0-dev}; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p less-app --target "$t"
          done
          mkdir -p target/release
          lipo -create -output target/release/less-rs \
            target/aarch64-apple-darwin/release/less-rs target/x86_64-apple-darwin/release/less-rs
          lipo -archs target/release/less-rs

      - name: Package (zip + dmg)
        env:
          LESS_VERSION: ${{ steps.v.outputs.version }}
        run: scripts/package-macos.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: less-rs-macos
          path: build/dist/*
          if-no-files-found: error

  release:
    needs: macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.macos.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: less-rs-macos
          path: dist

      - name: Checksums and notes
        run: |
          cd dist && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          **macOS 12+ (Apple silicon and Intel):** download \`LESS-$VERSION-macos-universal.dmg\` (or \`.zip\`) and drag LESS.app to Applications.

          This build is ad-hoc signed and not notarized, so macOS may report it as "damaged" or from an unidentified developer. Clear the download flag once:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/LESS.app
          \`\`\`

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: LESS ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: dist/*

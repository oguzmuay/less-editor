name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit zsh

      - name: Lua syntax (LuaJIT, as Neovim)
        run: find nvim -name '*.lua' -print0 | xargs -0 -n1 luajit -bl >/dev/null

      - name: Shell syntax
        run: |
          for f in app/scripts/*.sh app/scripts/lessed app/less/install-macos.sh app/less/linux/install.sh app/less/linux/less-editor; do
            sh -n "$f"
          done
          bash -n install.sh
          zsh -n app/less/launch

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

[package]
name = "less-ai"
description = "AI paneli: terminal tabları (Claude, Codex, Gemini, Ollama), oturum izleme, .less/ai posta kutusu, LESS MCP sunucusu."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
portable-pty = "0.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
